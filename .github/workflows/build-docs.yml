name: Build and publish Animoia docs

# Assumes your Pages branch is "main". If Settings → Pages shows a different
# branch (e.g. gh-pages), change every "main" below to match.

on:
  push:
    branches: [main]
    paths:
      - "docs-src/**"
      - ".github/workflows/build-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-src/requirements.txt

      - name: Install docs dependencies
        run: pip install -r docs-src/requirements.txt

      - name: Build HTML
        run: sphinx-build -b html -W --keep-going docs-src docs-build

      - name: Disable Jekyll processing
        run: touch docs-build/.nojekyll

      - name: Publish to documentation/ on main
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-build
          publish_branch: main
          destination_dir: documentation
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
