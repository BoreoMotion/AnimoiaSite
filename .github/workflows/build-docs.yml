name: Build and publish Animoia docs

# Assumes your Pages branch is "main". If Settings → Pages shows a different
# branch (e.g. gh-pages), change every "main" below to match.

on:
  push:
    branches: [main]
    paths:
      - "docs-src/**"
      - ".github/workflows/build-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-src/requirements.txt

      - name: Install docs dependencies
        run: pip install -r docs-src/requirements.txt

      - name: Build HTML
        run: sphinx-build -b html -W --keep-going docs-src docs-build

      - name: Disable Jekyll processing
        run: touch docs-build/.nojekyll

      - name: Replace documentation/ with the fresh build
        run: |
          rm -rf documentation
          mv docs-build documentation

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add documentation
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Rebuild docs"
            git push
          fi
